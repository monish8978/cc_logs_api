version: '3.8'

services:
  # Redis: Task Broker & Cache
  redis:
    image: redis:7-alpine
    container_name: cc_logs_redis
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # FastAPI API
  api:
    build: .
    container_name: cc_logs_api
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=172.16.3.215
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    ports:
      - "10005:10005"
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 10005 --workers 4

  # Celery Worker
  worker:
    build: .
    container_name: cc_logs_worker
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_HOST=172.16.3.215
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    restart: always
    command: celery -A worker.celery_app worker --loglevel=info --pool=solo

networks:
  default:
    name: cc_logs_network
